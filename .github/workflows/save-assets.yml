# One-time: copies the genuine logo, team photos and client logos from the
# old WordPress site into the repo (public/media) so they survive the DNS switch.
# Run it from the Actions tab BEFORE pointing candies.studio at GitHub Pages.
name: Save brand assets to repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download assets from the old site
        run: npm run assets:pull -- --force

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f public/media
          if git diff --cached --quiet; then
            echo "No new assets to commit"
          else
            git commit -m "Save brand assets from old site"
            git push
          fi
